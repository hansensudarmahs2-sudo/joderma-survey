{% extends "dasar.html" %}
{% block judul %}Masuk &middot; JoDerma Survei{% endblock %}
{% block isi %}
<h1>Masuk</h1>
<p class="catatan">Halaman ini hanya untuk staf klinik.</p>
<div class="kartu" style="max-width:460px">
  <form method="post">
    <div style="margin-bottom:14px">
      <label for="nama">Nama pengguna</label>
      <input type="text" id="nama" name="nama" autocomplete="username" autofocus required>
    </div>
    <div style="margin-bottom:18px">
      <label for="sandi">Sandi</label>
      <input type="password" id="sandi" name="sandi" autocomplete="current-password" required>
    </div>
    <button class="utama" type="submit">Masuk</button>
  </form>
</div>
{% endblock %}
