<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>{% block judul %}Survei {{ klinik }}{% endblock %}</title>
<style>
  :root {
    --tinta: #1a1a1a; --redup: #5c5c5c; --garis: #dcdcdc; --latar: #f6f7f7;
    --kartu: #fff; --utama: #0b6b5e; --galat: #a3261f;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; padding: 0 16px 48px;
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
         color: var(--tinta); background: var(--latar); }
  .bungkus { max-width: 620px; margin: 0 auto; }
  header { padding: 28px 0 8px; }
  header .klinik { color: var(--utama); font-weight: 700; letter-spacing: .01em; }
  h1 { font-size: 23px; line-height: 1.3; margin: 10px 0 8px; }
  p.antar { color: var(--redup); margin: 0 0 22px; }
  .kartu { background: var(--kartu); border: 1px solid var(--garis);
           border-radius: 12px; padding: 18px 18px 20px; margin-bottom: 14px; }
  .tanya { font-weight: 600; margin: 0 0 14px; }
  .tanya .nomor { color: var(--redup); font-weight: 400; margin-right: 6px; }
  .wajib { color: var(--galat); }
  /* ---------------------------------------------------------------- bintang
     Susunan DOM sengaja terbalik (5..1) dengan row-reverse, supaya bintang
     yang dipilih beserta semua bintang di kirinya bisa diwarnai hanya dengan
     CSS (input:checked ~ label). Tanpa JavaScript pun tetap berfungsi. */
  .nilai { display: flex; flex-direction: column; gap: 5px; }
  .bintang { display: flex; flex-direction: row-reverse; justify-content: flex-end;
             gap: 2px; }
  .bintang input { position: absolute; opacity: 0; pointer-events: none; }
  .bintang label { cursor: pointer; padding: 5px 3px; line-height: 0;
                   border-radius: 8px; }
  .bintang svg { width: 44px; height: 44px; display: block;
                 fill: #e7e7e7; stroke: #c4c4c4; stroke-width: 1.1px; }
  .bintang input:checked ~ label svg { fill: #f0a500; stroke: #c98400; }
  .bintang label:hover svg,
  .bintang label:hover ~ label svg { fill: #f7c75a; stroke: #c98400; }
  .bintang:hover input:checked ~ label svg { fill: #e7e7e7; stroke: #c4c4c4; }
  .bintang:hover label:hover svg,
  .bintang:hover label:hover ~ label svg { fill: #f7c75a; stroke: #c98400; }
  .bintang input:focus-visible + label { outline: 2px solid var(--utama);
                                         outline-offset: 1px; }
  /* Jangkar kata selalu terlihat. Skala tanpa jangkar ditafsirkan
     berbeda-beda antar responden, dan itu merusak perbandingan antar
     periode (metodologi bagian 5). */
  .jangkar { display: flex; justify-content: space-between; gap: 10px;
             font-size: 11.5px; color: var(--redup); padding: 0 4px; }
  .terpilih { margin: 0; font-size: 13px; font-weight: 600;
              color: var(--utama); min-height: 18px; padding: 0 4px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap; }

  textarea { width: 100%; font: inherit; padding: 11px 12px; border-radius: 10px;
             border: 1.5px solid var(--garis); min-height: 96px; resize: vertical;
             background: var(--kartu); color: var(--tinta); }
  textarea:focus { outline: none; border-color: var(--utama); }
  .yatidak { display: flex; gap: 10px; }
  .yatidak input { position: absolute; opacity: 0; pointer-events: none; }
  .yatidak label { flex: 1; text-align: center; padding: 13px 10px;
                   border: 1.5px solid var(--garis); border-radius: 10px;
                   cursor: pointer; background: var(--kartu); font-weight: 600; }
  .yatidak input:checked + label { border-color: var(--utama);
                                   background: #eaf4f2; color: var(--utama); }
  .yatidak input:focus-visible + label { outline: 2px solid var(--utama);
                                         outline-offset: 2px; }
  button.kirim { width: 100%; font: inherit; font-weight: 700; font-size: 17px;
                 padding: 15px; border-radius: 10px; border: none;
                 background: var(--utama); color: #fff; cursor: pointer;
                 margin-top: 6px; }
  button.kirim:hover { opacity: .92; }
  .galat { background: #fdf4f3; border: 1px solid #e8bfbc; color: var(--galat);
           border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .catatan { color: var(--redup); font-size: 13.5px; margin: 18px 0 0; }
  .hening { display: none; }
  footer { color: var(--redup); font-size: 13px; text-align: center;
           margin-top: 26px; }
  /* Dua kolom hanya bila cukup lebar. Di ponsel, kolom kanan tidak muat
     untuk lima bintang berukuran sentuh yang nyaman, jadi menumpuk. */
  @media (min-width: 600px) {
    .kartu.berskala { display: grid; align-items: center; gap: 22px;
                      grid-template-columns: minmax(0, 1.35fr) minmax(220px, 1fr); }
    .kartu.berskala .tanya { margin: 0; }
  }
  @media (max-width: 380px) {
    body { padding-left: 12px; padding-right: 12px; }
    .kartu { padding: 16px 13px 18px; }
    .bintang svg { width: 36px; height: 36px; }
    .bintang label { padding: 5px 1px; }
    .jangkar { font-size: 10.5px; }
  }
</style>
</head>
<body>
<div class="bungkus">
{% block isi %}{% endblock %}
</div>
</body>
</html>
