[project]
name = "joderma-survey"
version = "0.1.0"
description = "Sistem survei pelanggan JoDerma"
requires-python = ">=3.11"
dependencies = [
    # Pembacaan .xls Omnicare. pandas TIDAK dipakai: laporan Omnicare punya
    # struktur OLE2 cacat sehingga pandas.read_excel() gagal dengan
    # CompDocError. Lihat docs/temuan-data.md butir T1.
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joderma_survey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
