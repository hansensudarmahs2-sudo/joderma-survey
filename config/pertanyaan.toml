[[pertanyaan]]
set = "RJ"
kode = "sikap_staf"
teks = "Bagaimana penilaian Anda terhadap sikap staf non-medis dalam melayani Anda?"
jenis = "skala_1_5"

[[pertanyaan]]
set = "RJ"
kode = "kenyamanan"
teks = "Bagaimana penilaian Anda terhadap kenyamanan dan kebersihan ruang klinik?"
jenis = "skala_1_5"

[[pertanyaan]]
set = "RJ"
