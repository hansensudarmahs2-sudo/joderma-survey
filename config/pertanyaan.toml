teks = "Bagaimana penilaian Anda terhadap kejelasan informasi biaya sebelum tindakan?"
jenis = "skala_1_5"

[[pertanyaan]]
set = "RJ"
kode = "keluhan_lanjutan"
teks = "Boleh ceritakan apa yang kurang pada bagian itu?"
jenis = "teks"
